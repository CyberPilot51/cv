<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Funky Duck</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(to bottom, #87CEEB 0%, #b2e0f7 60%, #c9f7c1 60%, #8fd97a 100%);
    font-family: 'Comic Sans MS', cursive, sans-serif;
  }

  .title {
    text-align: center;
    padding-top: 20px;
    color: #333;
    text-shadow: 2px 2px 0 #fff;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 300px;
    margin-top: 40px;
  }

  .duck-wrapper {
    position: absolute;
    bottom: 0;
    left: -150px;
    width: 140px;
    height: 160px;
  }

  .duck {
    position: absolute;
    bottom: 0;
    width: 140px;
    height: 140px;
    cursor: pointer;
    animation: bob 0.4s ease-in-out infinite;
    transition: transform 0.15s ease-out;
  }

  .duck.flipped {
    transform: scaleX(-1);
  }

  .duck.startled {
    animation: bob 0.4s ease-in-out infinite, hop 0.35s ease-out;
  }

  .duck.party {
    animation: bob 0.15s ease-in-out infinite, spin 0.6s linear infinite;
  }

  @keyframes hop {
    0%   { margin-top: 0px; }
    40%  { margin-top: -35px; }
    100% { margin-top: 0px; }
  }

  @keyframes spin {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }

  .bubble {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%) scale(0);
    background: #fff;
    border: 2px solid #212121;
    border-radius: 12px;
    padding: 4px 10px;
    font-weight: bold;
    font-size: 14px;
    white-space: nowrap;
    transition: transform 0.15s ease-out;
    pointer-events: none;
  }
  .bubble.show {
    transform: translateX(-50%) scale(1);
  }

  @keyframes bob {
    0%, 100% { margin-bottom: 0px; }
    50% { margin-bottom: 14px; }
  }

  .leg {
    transform-origin: top center;
    animation: strut 0.4s ease-in-out infinite;
  }
  .leg.back {
    animation-delay: 0.2s;
  }

  @keyframes strut {
    0%, 100% { transform: rotate(25deg); }
    50% { transform: rotate(-25deg); }
  }

  .sunglasses {
    animation: glint 2s ease-in-out infinite;
  }
  @keyframes glint {
    0%, 80%, 100% { opacity: 1; }
    90% { opacity: 0.6; }
  }

  .hat {
    animation: tilt 1.2s ease-in-out infinite;
    transform-origin: 70px 20px;
  }
  @keyframes tilt {
    0%, 100% { transform: rotate(-6deg); }
    50% { transform: rotate(6deg); }
  }

  .wing {
    transform-origin: 60px 70px;
    animation: groove 0.6s ease-in-out infinite;
  }
  @keyframes groove {
    0%, 100% { transform: rotate(-15deg); }
    50% { transform: rotate(35deg); }
  }

  footer {
    position: fixed;
    bottom: 10px;
    width: 100%;
    text-align: center;
    color: #555;
    font-size: 14px;
  }
</style>
</head>
<body>

<h1 class="title">🦆 The Funkiest Duck Alive 🦆</h1>

<div class="stage" id="stage">
 <div class="duck-wrapper" id="duckWrapper">
  <div class="bubble" id="bubble">QUACK!</div>
  <svg class="duck" id="duck" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">

    <!-- back leg -->
    <g class="leg back">
      <rect x="55" y="95" width="8" height="30" rx="4" fill="#ff8c00"/>
      <polygon points="55,125 70,125 63,132 48,132" fill="#ff8c00"/>
    </g>

    <!-- front leg -->
    <g class="leg">
      <rect x="75" y="95" width="8" height="30" rx="4" fill="#ff8c00"/>
      <polygon points="75,125 90,125 83,132 68,132" fill="#ff8c00"/>
    </g>

    <!-- body -->
    <ellipse cx="70" cy="80" rx="45" ry="35" fill="#fff59d"/>
    <ellipse cx="70" cy="80" rx="45" ry="35" fill="none" stroke="#f5d90a" stroke-width="2"/>

    <!-- funky vest -->
    <path d="M35 65 Q70 55 105 65 L100 100 Q70 110 40 100 Z" fill="#e91e63"/>
    <circle cx="60" cy="80" r="3" fill="#ffeb3b"/>
    <circle cx="70" cy="90" r="3" fill="#ffeb3b"/>
    <circle cx="80" cy="80" r="3" fill="#ffeb3b"/>

    <!-- wing dancing -->
    <ellipse class="wing" cx="60" cy="75" rx="18" ry="10" fill="#fdd835"/>

    <!-- neck/head -->
    <circle cx="95" cy="45" r="22" fill="#fff59d"/>

    <!-- sunglasses -->
    <g class="sunglasses">
      <rect x="85" y="38" width="24" height="10" rx="5" fill="#212121"/>
      <rect x="108" y="41" width="6" height="3" fill="#212121"/>
    </g>

    <!-- beak -->
    <polygon points="112,48 130,45 112,55" fill="#ff9800"/>

    <!-- top hat -->
    <g class="hat">
      <rect x="80" y="10" width="26" height="20" fill="#212121"/>
      <rect x="74" y="28" width="38" height="6" fill="#212121"/>
      <rect x="80" y="10" width="26" height="5" fill="#e91e63"/>
    </g>

  </svg>
 </div>
</div>

<footer>strut it, duck 🕺 — wave your mouse near it, or click it!</footer>

<script>
  const stage = document.getElementById('stage');
  const wrapper = document.getElementById('duckWrapper');
  const duck = document.getElementById('duck');
  const bubble = document.getElementById('bubble');

  let x = -150;
  let dir = 1; // 1 = walking right, -1 = walking left
  let speed = 1.4;
  const baseSpeed = 1.4;
  let fleeing = false;
  let partying = false;
  let mouseX = null;
  let mouseY = null;
  let bubbleTimeout = null;
  let partyTimeout = null;

  function say(text, ms = 1200) {
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(bubbleTimeout);
    bubbleTimeout = setTimeout(() => bubble.classList.remove('show'), ms);
  }

  stage.addEventListener('mousemove', (e) => {
    const rect = stage.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
  });

  stage.addEventListener('mouseleave', () => {
    mouseX = null;
    mouseY = null;
  });

  duck.addEventListener('click', () => {
    partying = true;
    duck.classList.add('party');
    say("LET'S GOOO! 🎉", 1500);
    clearTimeout(partyTimeout);
    partyTimeout = setTimeout(() => {
      partying = false;
      duck.classList.remove('party');
    }, 2000);
  });

  function tick() {
    const stageWidth = stage.clientWidth;
    const duckCenter = x + 70;

    // Check proximity to mouse (startle reaction)
    if (mouseX !== null && !partying) {
      const dx = mouseX - duckCenter;
      const dy = (mouseY ?? 300) - 260; // duck feet roughly near bottom
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 90) {
        if (!fleeing) {
          fleeing = true;
          duck.classList.add('startled');
          say('QUACK!!', 900);
          setTimeout(() => duck.classList.remove('startled'), 350);
        }
        // flee in the opposite direction of the mouse
        dir = dx > 0 ? -1 : 1;
        speed = baseSpeed * 3.2;
      } else {
        if (fleeing) {
          speed = baseSpeed;
          fleeing = false;
        }
      }
    }

    if (!partying) {
      x += dir * speed;

      if (x > stageWidth - 20) {
        dir = -1;
      } else if (x < -140) {
        dir = 1;
      }

      wrapper.style.left = x + 'px';
      duck.classList.toggle('flipped', dir === -1);
    }

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
</script>

</body>
</html>
